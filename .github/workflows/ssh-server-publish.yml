name: Docker Build and Publish - SSH Server

on:
  schedule:
    # 北京时间每月 1–7 日 00:00 触发；由 guard 任务判定当天是否为当月第一个周六
    - cron: '0 0 1-7 * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

env:
  GHCR_REPO: ghcr.io/hexstan/sa-ssh-server
  CODE_BRANCH: dev

concurrency:
  group: ssh-server-publish
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: 判定是否需要构建（北京时间当月第一个周六，或手动触发）
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ "$(TZ=Asia/Shanghai date +%u)" = 6 ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: guard
    if: needs.guard.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.CODE_BRANCH }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tag
        id: date
        run: echo "date=$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.GHCR_REPO }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.date.outputs.date }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: docker/ssh-server/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
