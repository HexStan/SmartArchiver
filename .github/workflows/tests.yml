name: Tests

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 安装 uv 并由 uv 托管 Python 3.14（写入 UV_PYTHON），与本地开发共用同一解释器来源；
      # 依赖缓存默认在 GitHub 托管 runner 上开启，按 uv.lock 内容命中
      - name: Install uv and set up Python 3.14
        uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.14'

      # --locked：uv.lock 与 pyproject.toml 不一致时直接失败（Dependabot uv 生态会同步更新两者）
      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Type check (Pyrefly)
        run: uv run --no-sync pyrefly check

      - name: Lint (Ruff)
        run: uv run --no-sync ruff check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - '3.14'
          - '3.15'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --locked

      - name: Run tests
        run: uv run --no-sync python -m pytest
