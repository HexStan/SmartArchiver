version: 2

updates:
  # GitHub Actions（.github/workflows/*.yml）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Python 依赖（pyproject.toml 的 PEP 735 依赖组 runtime / dev / build + 锁文件 uv.lock）
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build

  # 应用镜像（docker/app/Dockerfile）
  - package-ecosystem: docker
    directory: /docker/app
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    # python 基础镜像停留在 3.14（对齐 CI 测试矩阵与项目 3.14+ 约定），仅跟随补丁更新
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # SSH 服务端镜像（docker/ssh-server/Dockerfile，基础镜像为 alpine:latest 无版本可跟）
  - package-ecosystem: docker
    directory: /docker/ssh-server
    schedule:
      interval: weekly
    commit-message:
      prefix: build
