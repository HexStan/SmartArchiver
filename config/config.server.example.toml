# ==================================================
# SmartArchiver 服务器模式示例配置
# 用法：复制本文件为 config/config.server.toml 后按需修改。
# 各项含义与取值范围见 README「配置向导·第三步」，启动方式见 README「服务器模式」。
# ==================================================

# 【选填】实例标识名；默认 smartarchiver-server；范围：仅填名称，不带路径/后缀
instance_name = "smartarchiver-server"

# 【选填】日志文件存储目录；默认 "./logs"
log_dir = "./logs"

# 【选填】日志级别；默认 "INFO"
# 范围："DEBUG" / "INFO" / "SUCCESS" / "WARNING" / "ERROR" / "CRITICAL"
log_level = "INFO"

# 【选填】保留的日志文件数量，0 表示不清理；默认 0
# 范围：≥ 0 的整数
max_log_files = 30

# 【强烈建议设置】客户端连接时使用的 API 鉴权密钥；缺省为空字符串，等于无鉴权
api_key = "your_api_key"

# 【选填】HTTP 服务监听端口；默认 13579；范围：1-65535 的整数
port = 13579

# 【选填】最多同时处理的元数据请求数量；默认 1；范围：≥ 1 的整数
max_concurrent_metadata = 1

# 【选填】元数据请求的排队上限；默认 32；范围：≥ 0 的整数
max_queue_metadata = 32

# 【选填】最多同时处理的上传请求数量；默认 1；范围：≥ 1 的整数
max_concurrent_uploads = 1

# 【选填】上传请求的排队上限；默认 32；范围：≥ 0 的整数
max_queue_uploads = 32
