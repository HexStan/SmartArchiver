# ==================================================
# SmartArchiver 服务器模式配置
# 启动方式: python main.py --server
# ==================================================

lock_file = "/tmp/smartarchiver-server.lock"

log_dir = "./logs"
log_level = "INFO"
max_log_files = 30

api_key = "your_api_key"        # 连接到该实例时使用的 API Key
port = "13579"                  # HTTP 服务监听端口

max_concurrent_metadata = 1     # 最多同时处理的元数据请求数量（默认 1）
max_queue_metadata = 32         # 队列中最多允许的元数据请求数量（默认 32）

max_concurrent_uploads = 1      # 最多同时处理的上传请求数量（默认 1）
max_queue_uploads = 32          # 队列中最多允许的上传请求数量（默认 32）
