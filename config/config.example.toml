# ==================================================
# 全局基础配置
# ==================================================

# 锁文件路径，防止多个实例同时运行（可选，不配置则不启用实例锁）
# 如果需要同时运行多个实例，可以将程序复制多份，每份设置不同的为实例锁路径
# 或直接运行多个Docker容器，容器不受实例锁限制且环境互相隔离
lock_file = "/tmp/smartarchiver.lock"

# 文件操作失败时的最大重试次数
max_retries = 3

# 日志文件存储目录
log_dir = "./logs"

# 日志级别，可选值："DEBUG", "INFO", "WARNING", "ERROR"
log_level = "INFO"

# 保留的日志文件数量（0 表示不清理）
max_log_files = 30

# ==================================================
# 定时任务配置（可选）
# ==================================================

# [schedule]
# 如果不配置 [schedule] 块，程序将作为一次性脚本执行

# 定时模式："cron" 或 "interval"
# mode = "cron"

# cron 模式下的表达式（示例：每小时执行一次）
# cron_expr = "0 * * * *"

# interval 模式下的间隔秒数（任务执行完毕后开始计时）
# interval_seconds = 3600

# 启动后首次执行任务的延迟时间（秒，仅在配置了 mode 时生效）
# -1：等待至下个调度时间点再执行（默认值）
# 0：启动后立即执行
# 大于 0：等待指定秒数后执行第一次任务
# first_run_delay = -1

# ==================================================
# 远程实例配置（可选）
# ==================================================

# 连接其他 SmartArchiver 实例，将其目录作为任务的目标目录

# [[http_remotes]]
# alias = "my_nas"  # alias 仅允许 a-z、A-Z、0-9、-、_
# address = "http://192.168.10.10:13579"
# key = "your_api_key"
# timeout = 14400  # HTTP 请求超时时间（秒），默认 14400（4 小时），按需逐设备配置
# queue_time = 0   # 服务器繁忙时最多排队秒数；0 表示不排队直接放弃；按需逐设备配置

# [[http_remotes]]
# alias = "my_pc"
# address = "http://192.168.10.20:13579"
# key = "your_api_key"
# timeout = 3600  # 示例：1 小时超时
# queue_time = 120  # 示例：允许排队最多 2 分钟

# [[http_remotes]]
# alias = "bob_server"
# address = "https://sa.bob.com"  # 反向代理场景
# key = "your_api_key"

# 使用远程实例的目录作为 dest 的写法：
# 格式：{类型:别名}?路径
#   - 类型：http 或 ssh
#   - 别名：在 [[http_remotes]] 或 [[ssh_remotes]] 中定义的 alias
#   - 路径：远端目标目录路径
# 示例：
# dest = "{http:my_nas}?/vol/1000/backup"
# dest = "{http:my_pc}?D:/Backup"  # Windows 环境
# dest = "{http:bob_server}?/mnt/ext_users/backup"

# ==================================================
# SSH 远端主机配置（可选，用于 sync 模式）
# ==================================================

# 通过 SSH 连接远端主机，将其目录作为 sync 模式的同步目标。
# SSH 远端与 HTTP 远端的配置完全隔离，允许别名重复。
# 目前仅 sync 模式支持 SSH 远端。
# dest 格式示例：dest = "{ssh:my_vps}?/var/backups/data"

# [[ssh_remotes]]
# alias = "my_vps"                          # 必填，仅允许 a-z、A-Z、0-9、-、_
# host = "192.168.1.100"                    # 必填，远端主机地址
# user = "root"                             # 必填，SSH 用户名
# port = 22                                 # 选填，SSH 端口（默认 22）
# key_file = "/home/user/.ssh/id_rsa"       # 选填，SSH 私钥路径
# password_file = "/home/user/.ssh/pass"    # 选填，明文密码文件路径
#   - 若配置了 password_file，rsync 将通过 sshpass 传递密码
#   - rclone 将通过 SFTP 的 --sftp-pass 传递密码

# [[ssh_remotes]]
# alias = "backup_host"
# host = "10.0.0.50"
# user = "backup"
# port = 2222
# key_file = "/home/user/.ssh/backup_key"

# 使用格式与 http_remotes 一致：
# dest = "{ssh:my_vps}?/var/backups/data"
# dest = "{ssh:backup_host}?/mnt/storage/archive"

# ==================================================
# 任务列表
# ==================================================

[[tasks]]
# 【选填】任务名称，可自定义
name = "移动/复制任务示例"

source = "./source" # 源目录路径
dest = "./dest"     # 目标目录路径

# 【必填】任务执行模式：
# "move" - 移动文件到目标目录
# "copy" - 复制文件到目标目录
mode = "copy"

# 【必填】修改时间阈值（分钟），只有修改时间超过此时间的文件才会被处理
# 注意：所有操作（包括删除规则）都必须满足此时间阈值
mtime_threshold_minutes = 180

# 【选填】文件冲突处理策略：
# "skip" - 跳过已存在的文件（默认）
# "overwrite" - 覆盖目标文件
# "copy" - 创建带编号的副本（如 file-1.txt）
conflict_policy = "skip"

# 【必填】是否删除源目录中的空目录
remove_empty_dirs = true

# 匹配规则说明：
#
# 决策流水线（按顺序判断，命中即停止）：
#   1. include_rules 匹配？→ 不匹配则跳过（不处理），匹配则继续
#      注意：目录始终通过 include 检查，以确保能遍历到匹配的子项
#   2. exclude_rules 匹配？→ 匹配则跳过（保留在原处），不匹配则继续
#   3. delete_rules 匹配？→ 匹配则删除，不匹配则正常传输（移动/复制）
#
# 若 include_rules 未配置，则所有文件均视为"已纳入"，直接从第 2 步开始。
#
# 大小阈值:
#   - 仅当文件/目录大小【小于/大于等于】设定的阈值时，规则才会生效。lt 为小于，ge 为大于等于。
#   - 如果希望匹配所有大小，请使用 ge 规则并设置为 -1（例如: "*.log" = -1）。
#   - 支持单位: B、KB、MB、GB、TB，-1 表示不限制。

# 【选填】纳入规则：仅命中的文件会被处理，未命中则跳过
# 不配置此项（或删除整个 [tasks.include_rules] 块）则所有文件均纳入处理
[tasks.include_rules]
# 激活的示例（取消注释即生效）：
# lt."*.mp4" = "10GB"                 # 纳入小于 10GB 的 .mp4 文件
# ge."*.doc" = "1MB"                  # 纳入大于等于 1MB 的 .doc 文件

# 更多模式示例：
# lt."*.log" = "10MB"               # 后缀匹配：匹配 .log 后缀且小于 10MB 的文件
# ge."beta*" = "100MB"              # 前缀匹配：匹配 beta 开头且大于等于 100MB 的文件
# ge."*charlie*" = "1GB"             # 部分匹配：匹配名称中包含 charlie 且大于等于 1GB 的文件
# ge."delta.db" = -1                # 匹配所有名称为 delta.db 的文件

# 目录匹配示例（末尾有`/`时匹配目录，目录内的子项自动继承纳入状态）：
# ge."videos/" = -1                 # 纳入 videos 目录及其所有子项
# lt."*echo*/" = "500MB"            # 匹配名称中包含 echo 且小于 500MB 的目录

# 多级路径匹配示例：
# lt."hotel/india/juliett/" = "5GB" # 匹配 hotel/india/ 下小于 5GB 的 juliett 目录
# lt."kilo/*.pdf" = "100MB"          # 匹配 kilo 目录下 .pdf 后缀且小于 100MB 的文件
# lt."lima/*/mike*" = "50MB"         # 匹配 lima 下一级子目录中 mike 开头且小于 50MB 的文件

# 【选填】排除规则：命中的文件/目录将保留在原处，不处理
[tasks.exclude_rules]
# 示例：
# lt."*.log" = "10MB"               # 保留小于 10MB 的 .log 文件
# ge."important.tmp" = -1            # 保留所有 important.tmp 文件
# ge."backup/" = -1                 # 保留所有 backup 目录（不遍历）

# 【选填】删除规则：命中的文件/目录将被直接删除，不移动到目标目录
[tasks.delete_rules]
# 示例：
# lt."*.tmp" = "1KB"                # 删除小于 1KB 的 .tmp 文件
# ge."cache/" = "1GB"               # 删除大于等于 1GB 的 cache 目录
# ge."*" = -1                       # 删除所有文件（仅删除，不传输）

# --------------------------------------------------

[[tasks]]
name = "轮转移动任务示例"

source = "./source-2"
dest = "./dest-2"     # 【该模式下选填】

# 【必填】任务执行模式：
# "rotate" - 轮转模式
# 当满足以下任一限制条件时，将最旧的文件移动到目标目录（或删除）：
# 1. 源目录总体积超过 size_limit
# 2. 源目录文件总数超过 count_limit
# 3. 命中 rotate_rules 中的特定文件限制
mode = "rotate"

conflict_policy = "skip"
remove_empty_dirs = true

#【以下四项必填至少一项】
size_limit = "1GB"    # 全局目录总体积限制，支持单位: B、KB、MB、GB、TB，0 表示不限制。
count_limit = 20    # 全局目录文件总数量限制，0 表示不限制。

# 细粒度轮转规则：
# 不支持以 / 结尾来匹配目录。如果需要轮转一个目录，请配置为 /*。
[tasks.rotate_rules.count]
"alpha/*" = 10        # 轮转阈值为 alpha 目录内有 10 个文件
"beta/*.mp4" = 100    # 轮转阈值为 beta 目录内有 100 个 MP4 文件
"*.log" = 10          # 轮转阈值为一共有 10 个 .log 文件
"charlie.zip" = 20    # 轮转阈值为一共有 20 个 charlie.zip 文件

[tasks.rotate_rules.size]
"logs/*" = "10MB"           # 轮转阈值为 logs 目录达到 10MB
"backup.iso" = "100MB"      # 轮转阈值为 backup.iso 文件达到 100MB

# 符合轮转要求的文件会继续匹配以下规则：
[tasks.exclude_rules]

[tasks.delete_rules]
# 如果希望轮转时直接删除而不是移动，可以配置：
# ge."*" = -1

# --------------------------------------------------

[[tasks]]
name = "同步任务示例"

source = "./source-3"
dest = "./dest-3"

# 【必填】任务执行模式：
# "sync" - 将源目录以镜像方式同步到目标目录
mode = "sync"

# 【选填】同步工具选择（默认 "auto"）：
# - "auto"：自动判断 — Windows 上使用 rclone，Linux/macOS 上使用 rsync
# - "rsync"：强制使用 rsync（需确保系统中已安装）
# - "rclone"：强制使用 rclone（需确保系统中已安装）
# tool = "auto"

# 【选填】排除同步的文件或目录（支持通配符，由 rclone/rsync 处理）
# exclude = ["*.tmp", "node_modules/"]

# 【选填】是否为要替换或删除的文件复制副本
# create_backups = true

# 【选填】最多保留的副本份数（0 表示不限制）
# max_backups = 5

# 同步模式下不支持配置 rules，请在 exclude 中指定
