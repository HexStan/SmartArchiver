# ==================================================
# SmartArchiver 客户端示例配置
# 本文件仅列出各配置项的中文含义、允许填写范围与默认值；
# 行为细节、规则语法与完整教程见 README「配置向导」。
# 用法：复制本文件为 config/config.toml 后按需修改。
# ==================================================

# --------------------------------------------------
# 全局基础配置
# --------------------------------------------------

# 【选填】实例标识名：锁文件、控制文件、日志文件共用此名；多实例并行时须互不相同
# 范围：仅填名称（不带路径/后缀）；缺省或非法时使用默认标识 smartarchiver
# instance_name = "smartarchiver"

# 【选填】单文件操作失败的最大重试次数；默认 3
# 范围：≥ 0 的整数
# max_retries = 3

# 【选填】日志文件存储目录；默认 "./logs"
# log_dir = "./logs"

# 【选填】日志级别；默认 "INFO"
# 范围："DEBUG" / "INFO" / "SUCCESS" / "WARNING" / "ERROR" / "CRITICAL"
# log_level = "INFO"

# 【选填】保留的日志文件数量，0 表示不清理；默认 0
# 范围：≥ 0 的整数
# max_log_files = 30

# --------------------------------------------------
# 定时调度（可选；不配置则执行完所有任务后退出）
# --------------------------------------------------

[schedule]

# 【选填】定时模式；范围："cron" / "interval"
mode = "interval"

# 【interval 模式必填】每次执行完后等待的秒数；范围：> 0
interval_seconds = 3600

# 【cron 模式必填】cron 表达式，如 "0 0 * * *"（每天 0 点）
cron_expr = "0 0 * * *"

# first_run_delay：【选填】启动后首次执行延迟（秒），仅配置了 mode 时生效；默认 -1
#   范围：-1（等到下个调度点）/ 0（立即）/ 正数（等待 N 秒）
# first_run_delay = -1

# --------------------------------------------------
# HTTP 远端（可选）：把其他 SmartArchiver 服务器的目录作为任务目标
# --------------------------------------------------

# [[http_remotes]]

# 【必填】远端别名，供 dest 引用；范围：a-z、A-Z、0-9、-、_
alias = "my_nas"

# 【必填】服务器地址，如 "http://192.168.10.10:13579"，也可为反向代理后的 HTTPS 域名
address = "http://192.168.10.10:13579"

# 【必填】与服务器 api_key 一致的鉴权密钥
key = "your_api_key"

# 【选填】HTTP 请求超时秒数；默认 14400（4 小时）；范围：≥ 0
# timeout = 14400

# 【选填】服务器繁忙时最多排队秒数，0 表示不排队直接放弃；默认 0；范围：≥ 0
# queue_time = 120

# dest 引用远端的写法：{http:别名}?远端路径
# 如 dest = "{http:my_nas}?/vol/1000/backup"

# --------------------------------------------------
# SSH 远端（可选，仅 sync 模式支持）：把 SSH 主机的目录作为同步目标
# --------------------------------------------------

# [[ssh_remotes]]

# 【必填】远端别名；范围：a-z、A-Z、0-9、-、_（与 HTTP 远端命名空间隔离，允许重名）
alias = "my_vps"

# 【必填】SSH 服务器地址
host = "192.168.1.100"

# 【必填】SSH 用户名
user = "root"

# 【选填】SSH 端口；默认 22；范围：1-65535 的整数
# port = 22

# 【选填】SSH 私钥路径（公钥认证）
# key_file = "/root/.ssh/id_ed25519"

# 【选填】明文密码文件路径（密码认证，文件内容为单行密码）
# password_file = "/root/.ssh/pass"

# dest 引用远端的写法：{ssh:别名}?远端 POSIX 绝对路径
# 如 dest = "{ssh:my_vps}?/data"

# --------------------------------------------------
# 任务列表（[[tasks]] 数组，配置顺序即执行顺序）
# --------------------------------------------------

# ---- move / copy 模式：移动/复制文件到目标目录 ----
[[tasks]]

# 【选填】任务唯一标识，供其他任务的 depends_on 引用
#  范围：a-z、A-Z、0-9、-、_，须在所有任务中唯一，不填则不能被依赖
# id = "task-1"

# 【选填】任务名称，仅用于日志展示
# name = "Task 1"

# 【必填】任务执行模式；范围："move" / "copy"（在当前配置组合下）
mode = "move"

# 【必填】源目录路径
source = "./source"

# 【选填】源目录静默期（秒），目录仍在写入时整任务跳过；
#  范围：≥ 0，0 或缺省不启用
# source_quiet_seconds = 300

# 【选填】目标目录路径；缺省时不传输文件，仅 delete_rules 有实际效果
# dest = "./dest"

# 【必填】修改时间阈值（秒），同时约束传输与删除；0 表示不限制
mtime_threshold_seconds = 10800

# 【必填】任务结束后是否清理源目录中的空目录
remove_empty_dirs = true

# 【选填】同名冲突策略；范围："skip"（默认）/ "overwrite" / "copy"（创建编号副本）
# conflict_policy = "skip"

# 【选填】纳入规则：仅命中的文件参与处理；缺省视为全部纳入
# 阈值范围：大小字符串（支持 B、KB/MB/GB/TB 十进制、KiB/MiB/GiB/TiB 二进制）或 -1（所有大小）
# 模式末尾带 / 匹配目录，不带 / 匹配文件；支持通配符 * 和 ?
# [tasks.include_rules]
# ge."*alpha*" = -1

# 【选填】排除规则：命中的文件/目录跳过
# [tasks.exclude_rules]
# ge."*bravo*" = -1

# 【选填】删除规则：命中的文件/目录直接删除，不传输
# [tasks.delete_rules]
# ge."*charlie*" = -1

# ---- rotate 模式：目录超限时从最旧的文件开始轮转（移动或删除）----
[[tasks]]

# id = "task-2"
# name = "Task 2"

# 【选填】依赖的前置任务 id 列表（单个字符串视为单元素列表）
# depends_on = "task-1"

# 【必填】任务执行模式；范围："rotate"（在当前配置组合下）
mode = "rotate"

source = "./source-2"
# source_quiet_seconds = 300

# dest = "./dest-2"

mtime_threshold_seconds = 10800

remove_empty_dirs = true
conflict_policy = "skip"

# 【选填】全局目录总体积上限，0 表示不限制；与 count_limit、rotate_rules 至少配置一项
# size_limit = "1GiB"

# 【选填】全局文件总数量上限，0 表示不限制
# count_limit = 20

# 【选填】规则级轮转限制：按模式分组设定上限；count 为数量、size 为体积；
# 不支持以 / 结尾匹配目录，限制目录下文件用 "目录名/*"
# [tasks.rotate_rules.count]
# "*delta*" = 100

# [tasks.rotate_rules.size]
# "*echo*" = "100MiB"

# [tasks.exclude_rules]
# ge."*foxtrot*" = -1

# [tasks.delete_rules]
# ge."*golf*" = -1

# ---- sync 模式：镜像同步（不支持规则系统，过滤见 exclude / exclude_from）----
[[tasks]]

# id = "task-3"
# name = "Task 3"
# depends_on = "task-2"

mode = "sync"

source = "./source-3"
# source_quiet_seconds = 300

# 【必填】目标目录路径
dest = "./dest-3"

# 【选填】同步工具；范围："auto"（默认）/ "rsync" / "rclone"
# tool = "auto"

# 【选填】排除模式列表，由底层工具处理
# exclude = ["*hotel*", "*india*"]

# 【选填】排除规则文件路径列表（对应 --exclude-from，可配置多个）
# exclude_from = ["./exclude-1.txt", "./exclude-2.txt"]

# 【选填】替换/删除前是否备份；默认 false
# create_backups = true

# 【选填】最多保留的备份份数，0 表示不限制；默认 0
# max_backups = 0
