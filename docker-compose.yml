services:
  smart-archiver:
    image: hexstan/smart-archiver:latest
    container_name: smart-archiver
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./source:/app/source
      - ./dest:/app/dest

  smart-archiver-server:
    image: hexstan/smart-archiver:latest
    container_name: smart-archiver-server
    restart: unless-stopped
    command: ["--server"]
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "13579:13579"
    volumes:
      - ./config/config.server.toml:/app/config/config.server.toml
      - ./logs:/app/logs
      - ./dest:/app/dest
