# SmartArchiver 项目配置：项目元数据、依赖与工具配置的唯一出处。
#
# 本项目是「源码直接运行」的 CLI 应用：Docker 跑源码、PyInstaller 打源码、
# 用户 clone 运行，不发布到 PyPI，因此无 [build-system]、不做 pip 安装。
# 版本号只写在 [project] 的 version 字段（发布流程与构建脚本使用，见 RELEASE-GUIDE.md）。
#
# 依赖以 PEP 735 依赖组声明，安装方式（pip ≥ 25.1，Python 3.14 自带的 pip 已满足）：
#   pip install --group runtime   # 仅运行依赖（Docker 镜像使用）
#   pip install --group dev       # runtime + pytest / ruff / pyrefly / 类型存根
#   pip install --group build     # runtime + PyInstaller（构建可执行文件）
# 所有依赖钉精确版本，由 Dependabot 每周自动更新（2026-02 起支持 [dependency-groups]）。

[project]
name = "smartarchiver"
# 版本号唯一出处（发布流程与构建脚本使用，见 RELEASE-GUIDE.md）：
# [x].[y].[z] 为正式版，带 -dev 后缀为开发版。
version = "0.38.3-dev"
description = "灵活的文件归档与清理工具：按规则移动、复制、轮转与同步文件"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "HexStan", email = "vanadir@163.com" }]
requires-python = ">=3.14"
keywords = ["archive", "cleanup", "file-management", "rotate", "rsync", "rclone", "sync"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: System :: Archiving",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/HexStan/SmartArchiver"
Repository = "https://github.com/HexStan/SmartArchiver"
Issues = "https://github.com/HexStan/SmartArchiver/issues"
Changelog = "https://github.com/HexStan/SmartArchiver/blob/dev/CHANGELOG.md"

[dependency-groups]
# 运行依赖：客户端 / 服务器模式的全部第三方库（Docker 镜像只装本组）
runtime = [
    "croniter==6.2.4",
    "flask==3.1.3",
    "humanize==4.16.0",
    "psutil==7.2.2",
    "pydantic==2.14.1",
    "requests==2.34.2",
]
# 开发与验证工具（运行时不需要，CI 的 typecheck / test job 安装本组，含 runtime）
dev = [
    { include-group = "runtime" },
    # pytest 不属于运行依赖，按 AGENTS.md 约定经 dev 组安装
    "pytest==9.1.1",
    # Ruff 的扩展默认规则集随版本变化（见 [tool.ruff] 头部注释），钉版本以保证 lint 结果可复现
    "ruff==0.17.2",
    # Pyrefly 的版本策略见下方 [tool.pyrefly] 头部注释
    "pyrefly==1.4.0",
    # typeshed 官方存根：psutil / croniter 未自带 py.typed，补齐后参与类型检查
    "types-psutil==7.2.2.20260906",
    "types-croniter==6.2.4.20261006",
    # flask 自带 py.typed；requests 2.34+ 自带内联类型，均无需存根
    # humanize / pydantic 自带 py.typed
]
# 可执行文件构建：scripts/build_executable.py 需要 PyInstaller（含 runtime）
build = [
    { include-group = "runtime" },
    "pyinstaller==6.22.3",
]

[tool.pytest.ini_options]
# 测试体系详见 tests/README.md
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# 规则集跟随 Ruff 0.17 起的扩展默认集（约 800 条，覆盖 F/E/W/B/SIM/PERF/PL/RUF 等
# 规则族，但不含 E501、ANN、COM 等风格类规则）。不在配置中逐条罗列全部规则，
# 只在此声明项目约定与例外；升级 Ruff 后若默认集变化，可用
# `ruff check --isolated --show-settings` 复核差异。

# E501 未在默认集中启用，此值供 ruff format 对齐现状
line-length = 100
target-version = "py314"

[tool.ruff.lint]

[tool.ruff.lint.per-file-ignores]
# _process_directories 为每个目录定义 get_size 闭包，闭包引用了循环变量
# dir_path / dir_size_cache / dir_mtime_cache，但仅在同一次迭代内被
# policy.decide() 同步调用（规则引擎命中即停），不存在晚绑定问题，属误报。
"src/core/handlers/standard.py" = ["B023"]

[tool.ruff.format]
# 格式化遵循 Ruff Format 默认风格，显式声明项目约定；行宽沿用顶层 line-length = 100。
#
# target-version = "py314" 使 format 会把 `except (A, B):` 改写为 PEP 758 的
# 无括号形式 `except A, B:`（Python 3.14 起合法），此为预期行为，非 bug。
quote-style = "double"
# 换行符固定为 LF，与 .gitattributes 一致（"auto" 默认值会逐文件探测，混入 CRLF
# 文件时不同平台产出不一致）。
line-ending = "lf"

[tool.pyrefly]
# Pyrefly 类型检查配置（权威文档：本节注释；AGENTS.md「类型检查」仅作入口）
#
# ============================================================
# 工具与版本策略
# ============================================================
# 门禁工具为 Pyrefly：pip 安装的 Rust 单二进制，无 Node 依赖。
# Pyrefly 每月发布 minor 且不保证无新报错，因此用 dev 依赖组固定版本 +
# 此处 required-version 双保险。
#
# 升级流程：改 [dependency-groups] 的 dev 组固定版本（下方 required-version
# 上限 <2 已兜底），跑 `pyrefly check`，新增报错逐条修复；确需豁免的用
# `# type: ignore[pyrefly:错误码]` 定点抑制并附中文注释，禁止裸
# `# type: ignore`（strict 的 unused-ignore 会自动清理过期抑制）。
required-version = ">=1.4.0,<2"

# ============================================================
# 检查范围
# ============================================================
# 仅覆盖 src/ 与 main.py。tests/ 与 scripts/ 暂不纳入：
# 测试大量使用无类型 lambda 与 object() 打桩，注解收益低、改动面大。
project-includes = ["src", "main.py"]

# 代码以仓库根为包根（`from src.fs import ...`，与 [tool.pytest.ini_options]
# 的 pythonpath 一致），显式声明导入根，避免 pyrefly 从目录布局误推断
# import root 为 src/
search-path = ["."]

# ============================================================
# 平台与版本口径
# ============================================================
# 与 [tool.ruff] 的 target-version 保持一致。
python-version = "3.14"

# 固定按 Linux 语义检查，与 CI typecheck job（ubuntu）一致，本地与 CI 口径统一：
# POSIX 的 fcntl 能完整解析；Windows 专属代码（msvcrt / ctypes.windll）以定点
# `# type: ignore[pyrefly:missing-attribute]` + 中文注释说明放行。
python-platform = "Linux"

# ============================================================
# 严格度
# ============================================================
# strict 预设：启用 implicit-any、missing-override-decorator、unused-ignore 等。
preset = "strict"

# ============================================================
# 注解约定
# ============================================================
# 1. 3.14 原生写法：内置泛型（list[str]）、X | None、PEP 695；不写
#    `from __future__ import annotations`（PEP 649 惰性注解下无必要）；
#    覆写方法一律加 @override。
# 2. 配置经 Pydantic 模型在加载期校验：任务模型（src/core/task_config）、
#    全局段（src/app/config 的 GlobalConfig / BootstrapConfig / ScheduleConfig）、
#    远端条目（src/remote/factory.py、src/ssh/remotes.py，共享字段类型见
#    src/validation.py）。模型层之外不建 TypedDict；tomllib 的原始读取边界
#    （ConfigManager.load_toml 返回值、bootstrap 前的 raw_config）仍注解为
#    dict[str, Any]，模型只在该边界之后接管。
# 3. 日志接口是 src/output/logger.py 的 Logger 协议（结构化）：参数注解用
#    Logger 而非具体类，测试替身（CaptureLogger 等）结构兼容即可注入。
# 4. 类型级依赖不构成分层违规：仅为注解服务的 import 放在 TYPE_CHECKING 下
#    （如 remote/server.py 引用 app.shutdown、app/context.py 引用 core.history），
#    运行时导入图不变。

[tool.pyrefly.errors]
# 按需追加错误码的 severity 覆盖；保持空表意味着全部跟随 strict 预设。
